general {
    hide_cursor = true
}

background {
    monitor =
    path = @wallpaper@
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 250, 60
    rounding = 20
    outline_thickness = 3
    outer_color = rgba(19b6eee6)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgb(255, 255, 255)
    placeholder_text = <i>Password...</i>
    fade_on_empty = true
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1)
    font_size = 90
    font_family = sans-serif
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 22
    font_family = sans-serif
    position = 0, 80
    halign = center
    valign = center
}
